name: Project website

# The site is published by phpforge-dev/php-ide at https://phpforge-dev.github.io/php-ide/.
# This repository only validates the build and asks php-ide to publish it.
on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/build-pages.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public files
        run: node scripts/build-pages.mjs
      - name: Ask php-ide to publish
        env:
          GH_TOKEN: ${{ secrets.PHP_IDE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PHP_IDE_DISPATCH_TOKEN is not set. Publish with: gh workflow run website.yml -R phpforge-dev/php-ide"
            exit 0
          fi
          gh api repos/phpforge-dev/php-ide/dispatches -f event_type=website-updated
